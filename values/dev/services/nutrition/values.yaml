# ApplicationSet은 values/dev/services/*를 자동 스캔한다.
# image.tag는 AI Jenkins가 develop real deploy에서 ECR push 후 자동 갱신하므로 수동 수정하지 않는다.
image:
  repository: 297165773875.dkr.ecr.ap-northeast-2.amazonaws.com/petflow/nutrition
  tag: "1b1b3b930a2a3c02ed86b2ad6c095a402311846d"
  pullPolicy: IfNotPresent
replicaCount: 1
service:
  type: ClusterIP
  port: 80
  targetPort: 8002
metrics:
  enabled: true
  path: /metrics
  interval: 15s
# 첫 내부 통신 검증 전에는 Public ALB에 연결하지 않는다.
ingress:
  enabled: false
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi
autoscaling:
  enabled: false
canary:
  enabled: false
blueGreen:
  enabled: false
# v1.0 내부 호출은 API Gateway → Nutrition HTTP 8002 + internal secret + NetworkPolicy 경계를 사용한다.
# 이번 통합에서 Nutrition 자체 mTLS를 새로 도입하지 않는다.
startupProbe:
  tcpSocket:
    port: 8002
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 18
readinessProbe:
  httpGet:
    path: /ready
    port: 8002
    scheme: HTTP
  periodSeconds: 10
  timeoutSeconds: 15
  failureThreshold: 6
  successThreshold: 1
livenessProbe:
  httpGet:
    path: /health
    port: 8002
    scheme: HTTP
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 6
  successThreshold: 1
networkPolicy:
  enabled: true
  namespaceDefaultDeny: true
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: "api-gateway"
          podSelector:
            matchLabels:
              app.kubernetes.io/name: "generic-service"
              app.kubernetes.io/instance: "dev-api-gateway"
      ports:
        - protocol: "TCP"
          port: 8002
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: "network-debug"
      ports:
        - protocol: "TCP"
          port: 8002
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: "kube-system"
          podSelector:
            matchLabels:
              k8s-app: "kube-dns"
      ports:
        - protocol: "UDP"
          port: 53
        - protocol: "TCP"
          port: 53
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: "database"
          podSelector:
            matchLabels:
              cnpg.io/cluster: "petflow-db"
              cnpg.io/instanceRole: "primary"
      ports:
        - protocol: "TCP"
          port: 5432
env:
  - name: NUTRITION_RUNTIME_MODE
    value: "service"
  - name: MEMBER_DATABASE_URL
    valueFrom:
      secretKeyRef:
        name: db-credentials
        key: MEMBER_DATABASE_URL
  - name: PRODUCT_DATABASE_URL
    valueFrom:
      secretKeyRef:
        name: db-credentials
        key: PRODUCT_DATABASE_URL
  - name: INTERNAL_GATEWAY_SECRET
    valueFrom:
      secretKeyRef:
        name: gateway-secret
        key: INTERNAL_GATEWAY_SECRET
