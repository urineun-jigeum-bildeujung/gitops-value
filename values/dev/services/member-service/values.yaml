externalEgress:
  enabled: true
  runtime: java
  allowedDomains:
    - "petflow-dev-uploads.s3.ap-northeast-2.amazonaws.com"
# 내부 Ingress/Egress 제한. mTLS・SASL 설정은 변경하지 않는다.
networkPolicy:
  enabled: true
  namespaceDefaultDeny: true
  ingress:
    # 예정된 Gateway 배포는 아래 Namespace/라벨을 사용해야 한다.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: api-gateway
          podSelector:
            matchLabels:
              app.kubernetes.io/name: generic-service
              app.kubernetes.io/instance: dev-api-gateway
      ports:
        - protocol: TCP
          port: 8443
    # 메트릭 수집은 Prometheus Pod만 관리/API 포트에 접근하도록 허용한다.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
              app.kubernetes.io/instance: kube-prometheus-stack-prometheus
      ports:
        - protocol: TCP
          port: 8080
    # 코드상 필요한 서비스 간 호출. 호출 URL/mTLS 구현은 별도 담당한다.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: auth-service
          podSelector:
            matchLabels:
              app.kubernetes.io/name: generic-service
              app.kubernetes.io/instance: dev-auth-service
      ports:
        - protocol: TCP
          port: 8443
    # review-service의 MemberClient가 리뷰 작성자·반려동물 정보를 조회할 때만 허용한다.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: review-service
          podSelector:
            matchLabels:
              app.kubernetes.io/name: generic-service
              app.kubernetes.io/instance: dev-review-service
      ports:
        - protocol: TCP
          port: 8443
  # 내부 경로만 명시한다. 외부 HTTPS는 externalEgress 전용 프록시로만 허용한다.
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: "kube-system"
          podSelector:
            matchLabels:
              k8s-app: "kube-dns"
      ports:
        - protocol: "UDP"
          port: 53
        - protocol: "TCP"
          port: 53
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: "observability"
          podSelector:
            matchLabels:
              app.kubernetes.io/name: "tempo"
              app.kubernetes.io/instance: "tempo"
      ports:
        - protocol: "TCP"
          port: 4318
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: "database"
          podSelector:
            matchLabels:
              cnpg.io/cluster: "petflow-db"
              cnpg.io/instanceRole: "primary"
      ports:
        - protocol: "TCP"
          port: 5432
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: "auth-service"
          podSelector:
            matchLabels:
              app.kubernetes.io/name: "generic-service"
              app.kubernetes.io/instance: "dev-auth-service"
      ports:
        - protocol: "TCP"
          port: 8443
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: "product-service"
          podSelector:
            matchLabels:
              app.kubernetes.io/name: "generic-service"
              app.kubernetes.io/instance: "dev-product-service"
      ports:
        - protocol: "TCP"
          port: 8443
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: "review-service"
          podSelector:
            matchLabels:
              app.kubernetes.io/name: "generic-service"
              app.kubernetes.io/instance: "dev-review-service"
      ports:
        - protocol: "TCP"
          port: 8443
    - to:
        - ipBlock:
            cidr: "169.254.170.23/32"
      ports:
        - protocol: "TCP"
          port: 80
image:
  repository: 297165773875.dkr.ecr.ap-northeast-2.amazonaws.com/petflow/member-service
  tag: "4982a238be86566cd59926183fb1dd6ac8f5c2f1" # TODO: CI가 커밋 SHA 등 실제 빌드 태그를 넣도록 바뀌면 그걸로 교체
# 서비스 간 mTLS 5단계(2026-09-18). member-service -> auth-service Feign 호출(AuthClient)이
# 실제로 있어서 order-service와 달리 sever #73(Feign 클라이언트 mTLS 설정) 머지 및 재배포가
# 선행되어야 함 — auth-service의 mtls.enabled와 반드시 같은 타이밍에 켜져야 함(자세한 이유는
# auth-service/values.yaml 주석 참고).
mtls:
  enabled: true
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi
env:
  - name: SPRING_PROFILES_ACTIVE
    value: "dev"
  - name: SPRING_DATASOURCE_URL
    value: "jdbc:postgresql://petflow-db-rw.database.svc.cluster.local:5432/member_db"
  - name: SPRING_DATASOURCE_USERNAME
    valueFrom:
      secretKeyRef:
        name: db-credentials
        key: SPRING_DATASOURCE_USERNAME
  - name: SPRING_DATASOURCE_PASSWORD
    valueFrom:
      secretKeyRef:
        name: db-credentials
        key: SPRING_DATASOURCE_PASSWORD
  - name: SPRING_JPA_HIBERNATE_DDL_AUTO
    value: "update"
  # common-storage의 필수 프로퍼티. profiles prefix는 Pod Identity IAM 범위와 동일하다.
  - name: STORAGE_BUCKET
    value: "petflow-dev-uploads"
  - name: STORAGE_REGION
    value: "ap-northeast-2"
  - name: STORAGE_CLOUDFRONT_DOMAIN
    value: "https://image.leechs.shop"
  - name: STORAGE_PREFIX
    value: "profiles"
  # auth-service.url 프로퍼티 오버라이드. auth-service의 MEMBER_SERVICE_URL과 동일한
  # 패턴 — 점(.)과 대시(-)는 언더스코어 하나로 치환되어 매칭된다.
  - name: AUTH_SERVICE_URL
    value: "https://generic-service.auth-service.svc.cluster.local:8443"
  # product-service.url 프로퍼티 오버라이드(2026-09-20, 서비스 간 mTLS 일관 적용).
  # ProductClient는 공용 InternalFeignClientConfig를 쓰므로 이 서비스의 mtls.enabled가
  # 켜져있으면 인증서 처리는 자동 적용된다 — 코드 변경 없이 URL만 https:8443으로 지정.
  - name: PRODUCT_SERVICE_URL
    value: "https://generic-service.product-service.svc.cluster.local:8443"
  - name: REVIEW_SERVICE_URL
    value: "https://generic-service.review-service.svc.cluster.local:8443"
  - name: INTERNAL_GATEWAY_SECRET
    valueFrom:
      secretKeyRef:
        name: gateway-secret
        key: INTERNAL_GATEWAY_SECRET
  # OTel Java agent 기본 프로토콜(http/protobuf)이 쓰는 포트 4318로 맞춤 — 4317은 gRPC용.
  - name: OTEL_EXPORTER_OTLP_ENDPOINT
    value: "http://tempo.observability.svc.cluster.local:4318"
  - name: OTEL_METRICS_EXPORTER
    value: "none"
  - name: OTEL_LOGS_EXPORTER
    value: "none"
  # 로그-트레이스 상관연결용(2026-09-17, auth-service와 동일 이유).
  - name: LOGGING_PATTERN_LEVEL
    value: "%5p [${spring.application.name},trace_id=%X{trace_id:-},span_id=%X{span_id:-}]"
