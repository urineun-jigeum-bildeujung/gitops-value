# 서비스 간 mTLS 일관 적용(2026-09-20). auth/member/order-service와 동일 기준 —
# 서비스 간 HTTP 통신을 쓰는지 여부와 무관하게 전 서비스 공통 베이스라인으로 통일한다.
mtls:
  enabled: true
externalEgress:
  enabled: true
  runtime: java
  allowedDomains:
    - oauth2.googleapis.com
    - fcm.googleapis.com
# 내부 Ingress/Egress 제한. mtls.enabled=true면 SERVER_PORT가 8443으로 바뀌어
# 실제 API 트래픽은 8443으로만 오가므로(8080은 관리/액추에이터 포트로 남음),
# api-gateway ingress도 8443으로 맞춘다.
networkPolicy:
  enabled: true
  namespaceDefaultDeny: true
  ingress:
    # 예정된 Gateway 배포는 아래 Namespace/라벨을 사용해야 한다.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: api-gateway
          podSelector:
            matchLabels:
              app.kubernetes.io/name: generic-service
              app.kubernetes.io/instance: dev-api-gateway
      ports:
        - protocol: TCP
          port: 8443
    # 메트릭 수집은 Prometheus Pod만 관리/API 포트에 접근하도록 허용한다.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
              app.kubernetes.io/instance: kube-prometheus-stack-prometheus
      ports:
        - protocol: TCP
          port: 8080
  # 외부 인터넷은 차단하고, 명시한 내부 의존 경로만 허용한다.
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: "kube-system"
          podSelector:
            matchLabels:
              k8s-app: "kube-dns"
      ports:
        - protocol: "UDP"
          port: 53
        - protocol: "TCP"
          port: 53
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: "observability"
          podSelector:
            matchLabels:
              app.kubernetes.io/name: "tempo"
              app.kubernetes.io/instance: "tempo"
      ports:
        - protocol: "TCP"
          port: 4318
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: "product-service"
          podSelector:
            matchLabels:
              app.kubernetes.io/name: "generic-service"
              app.kubernetes.io/instance: "dev-product-service"
      ports:
        - protocol: "TCP"
          port: 8443
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: "database"
          podSelector:
            matchLabels:
              cnpg.io/cluster: "petflow-db"
              cnpg.io/instanceRole: "primary"
      ports:
        - protocol: "TCP"
          port: 5432
image:
  repository: 297165773875.dkr.ecr.ap-northeast-2.amazonaws.com/petflow/notification-service
  tag: "cd82dc4a2caccaf9bac4960b25911668d67c31b8" # TODO: CI가 커밋 SHA 등 실제 빌드 태그를 넣도록 바뀌면 그걸로 교체
deployment:
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
# JVM 힙/Metaspace 상한 미설정 상태에서 512Mi가 실사용 baseline과 거의 붙어있어서
# order-service가 실제로 3회 OOMKilled됨(2026-09-29). JVM 튜닝(gitops#109)과
# 별개의 안전 여유분으로 상향 — 7개 서비스 전부 동일 적용.
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 768Mi
volumeMounts:
  - name: fcm-credentials
    mountPath: /etc/fcm
    readOnly: true
volumes:
  - name: fcm-credentials
    secret:
      secretName: fcm-credentials
      items:
        - key: service-account.json
          path: service-account.json
env:
  - name: SPRING_PROFILES_ACTIVE
    value: "dev"
  - name: FCM_CREDENTIALS_PATH
    value: "/etc/fcm/service-account.json"
  # 현재 배포 이미지의 @Value("${fcm.credentials-path:}")에 경로를 직접 전달한다.
  # application-local.yml만 FCM_CREDENTIALS_PATH를 참조하므로 dev에서는 이 매핑이 필요하다.
  - name: SPRING_APPLICATION_JSON
    value: '{"fcm":{"credentials-path":"/etc/fcm/service-account.json"}}'
  - name: SPRING_DATASOURCE_URL
    value: "jdbc:postgresql://petflow-db-rw.database.svc.cluster.local:5432/notification_db"
  - name: SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE
    value: "3"
  - name: SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE
    value: "1"
  - name: SPRING_DATASOURCE_USERNAME
    valueFrom:
      secretKeyRef:
        name: db-credentials
        key: SPRING_DATASOURCE_USERNAME
  - name: SPRING_DATASOURCE_PASSWORD
    valueFrom:
      secretKeyRef:
        name: db-credentials
        key: SPRING_DATASOURCE_PASSWORD
  - name: SPRING_JPA_HIBERNATE_DDL_AUTO
    value: "update"
  # 기존 notification_db 스키마를 Flyway V1 기준선으로 등록한다.
  - name: SPRING_FLYWAY_BASELINE_ON_MIGRATE
    value: "true"
  - name: SPRING_FLYWAY_BASELINE_VERSION
    value: "1"
  - name: PRODUCT_SERVICE_URL
    value: "https://generic-service.product-service.svc.cluster.local:8443"
  - name: INTERNAL_GATEWAY_SECRET
    valueFrom:
      secretKeyRef:
        name: gateway-secret
        key: INTERNAL_GATEWAY_SECRET
  # OTel Java agent 기본 프로토콜(http/protobuf)이 쓰는 포트 4318로 맞춤 — 4317은 gRPC용.
  - name: OTEL_EXPORTER_OTLP_ENDPOINT
    value: "http://tempo.observability.svc.cluster.local:4318"
  - name: OTEL_METRICS_EXPORTER
    value: "none"
  - name: OTEL_LOGS_EXPORTER
    value: "none"
  # 로그-트레이스 상관연결용(2026-09-17, auth-service와 동일 이유).
  - name: LOGGING_PATTERN_LEVEL
    value: "%5p [${spring.application.name},trace_id=%X{trace_id:-},span_id=%X{span_id:-}]"
