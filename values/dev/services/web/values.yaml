externalEgress:
  enabled: true
  runtime: node
  allowedDomains:
    - "business.juso.go.kr"
    - "image.leechs.shop"
# 내부 Ingress/Egress 제한. Public ALB → Next.js 3000 및 예정 Gateway 호출 유지.
networkPolicy:
  enabled: true
  namespaceDefaultDeny: true
  ingress:
    - from:
        - ipBlock:
            cidr: "10.0.0.0/24"
        - ipBlock:
            cidr: "10.0.1.0/24"
      ports:
        - protocol: "TCP"
          port: 3000
  # 내부 경로만 명시한다. 외부 HTTPS는 externalEgress 전용 프록시로만 허용한다.
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: "kube-system"
          podSelector:
            matchLabels:
              k8s-app: "kube-dns"
      ports:
        - protocol: "UDP"
          port: 53
        - protocol: "TCP"
          port: 53
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: "api-gateway"
          podSelector:
            matchLabels:
              app.kubernetes.io/name: "generic-service"
              app.kubernetes.io/instance: "dev-api-gateway"
      ports:
        - protocol: "TCP"
          port: 8080
image:
  repository: 297165773875.dkr.ecr.ap-northeast-2.amazonaws.com/petflow/web
  tag: "f2bdc5a5da2196935f7e4e7d4a3d80ed055baec9" # TODO: CI가 커밋 SHA 등 실제 빌드 태그를 넣도록 바뀌면 그걸로 교체
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 512Mi
# Next.js standalone 서버가 3000번으로 뜬다 (차트 기본값 8080은 백엔드 서비스 기준).
service:
  targetPort: 3000
# Next.js Server Component가 클러스터 내부 Gateway를 호출할 때 사용하는 런타임 전용 주소.
# 브라우저는 기존 same-origin /api/v1 계약을 유지한다.
env:
  - name: API_BASE_URL_INTERNAL
    value: "http://generic-service.api-gateway.svc.cluster.local/api/v1"
# Public frontend entrypoint. The AWS Load Balancer Controller creates the
# internet-facing ALB; API Gateway can later join the same group with order 10.
ingress:
  enabled: true
  className: alb
  host: leechs.shop
  path: /
  pathType: Prefix
  annotations:
    alb.ingress.kubernetes.io/load-balancer-name: petflow-dev-public
    alb.ingress.kubernetes.io/group.name: petflow-public
    alb.ingress.kubernetes.io/group.order: "20"
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80},{"HTTPS":443}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:ap-northeast-2:297165773875:certificate/38399d86-e76d-4323-9b3d-721b32acd2ce
    alb.ingress.kubernetes.io/healthcheck-path: /
    alb.ingress.kubernetes.io/healthcheck-protocol: HTTP
    alb.ingress.kubernetes.io/success-codes: "200-399"
# 차트 기본 ServiceMonitor는 /actuator/prometheus(Spring Boot 전용) 경로를 스크랩한다.
# web(Next.js)은 그 경로가 없어서 path를 /metrics로 바꿔 미리 켜둔다(2026-09-21) — SSR
# 리소스 지표(메모리/응답지연) 요청에 대응. 프론트가 아직 prom-client 등으로 이 경로에
# 실제 메트릭을 노출하지 않은 상태라, 지금은 Prometheus가 스크랩 실패(404/connection
# refused)로만 찍히고 넘어간다 — 다른 기능에 영향 없는 무해한 상태. 프론트가 /metrics
# 엔드포인트를 실제로 추가하면 이 설정 변경 없이 바로 수집되기 시작한다.
metrics:
  enabled: true
  path: /metrics
