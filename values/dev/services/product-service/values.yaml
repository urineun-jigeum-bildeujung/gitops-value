# 서비스 간 mTLS 일관 적용(2026-09-20). auth/member/order-service와 동일 기준 —
# 서비스 간 HTTP 통신을 쓰는지 여부와 무관하게 전 서비스 공통 베이스라인으로 통일한다.
mtls:
  enabled: true

# 내부 Ingress/Egress 제한. mtls.enabled=true면 SERVER_PORT가 8443으로 바뀌어
# 실제 API 트래픽은 8443으로만 오가므로(8080은 관리/액추에이터 포트로 남음),
# api-gateway ingress도 8443으로 맞춘다.
networkPolicy:
  enabled: true
  namespaceDefaultDeny: true
  ingress:
    # 예정된 Gateway 배포는 아래 Namespace/라벨을 사용해야 한다.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: api-gateway
          podSelector:
            matchLabels:
              app.kubernetes.io/name: generic-service
              app.kubernetes.io/instance: dev-api-gateway
      ports:
        - protocol: TCP
          port: 8443
    # 메트릭 수집은 Prometheus Pod만 관리/API 포트에 접근하도록 허용한다.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
              app.kubernetes.io/instance: kube-prometheus-stack-prometheus
      ports:
        - protocol: TCP
          port: 8080
    # 코드상 필요한 서비스 간 호출. 호출 URL/mTLS 구현은 별도 담당한다.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: order-service
          podSelector:
            matchLabels:
              app.kubernetes.io/name: generic-service
              app.kubernetes.io/instance: dev-order-service
      ports:
        - protocol: TCP
          port: 8080
    # member-service ProductClient(Feign) 호출. 양쪽 다 mtls.enabled=true라 인증서
    # 처리는 공용 InternalFeignClientConfig가 자동 적용 — 코드 변경 없이 8443만 허용.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: member-service
          podSelector:
            matchLabels:
              app.kubernetes.io/name: generic-service
              app.kubernetes.io/instance: dev-member-service
      ports:
        - protocol: TCP
          port: 8443

  # 확정된 외부 목적지가 없어 인터넷 연결은 차단한다. 내부 경로만 허용한다.
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: "kube-system"
          podSelector:
            matchLabels:
              k8s-app: "kube-dns"
      ports:
        - protocol: "UDP"
          port: 53
        - protocol: "TCP"
          port: 53
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: "observability"
          podSelector:
            matchLabels:
              app.kubernetes.io/name: "tempo"
              app.kubernetes.io/instance: "tempo"
      ports:
        - protocol: "TCP"
          port: 4318
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: "database"
          podSelector:
            matchLabels:
              cnpg.io/cluster: "petflow-db"
              cnpg.io/instanceRole: "primary"
      ports:
        - protocol: "TCP"
          port: 5432
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: "kafka"
          podSelector:
            matchLabels:
              strimzi.io/cluster: "pet-subscription-kafka"
              strimzi.io/name: "pet-subscription-kafka-kafka"
              strimzi.io/kind: "Kafka"
              strimzi.io/broker-role: "true"
      ports:
        - protocol: "TCP"
          port: 9092
        - protocol: "TCP"
          port: 9093

image:
  repository: 297165773875.dkr.ecr.ap-northeast-2.amazonaws.com/petflow/product-service
  tag: "f4328cf372a61f85fcc41f613f49ad4000b4a59b" # TODO: CI가 커밋 SHA 등 실제 빌드 태그를 넣도록 바뀌면 그걸로 교체
# Kafka SASL 6단계(2026-09-18). generic-service 차트의 kafka.sasl.enabled를 켜면
# SPRING_KAFKA_SECURITY_PROTOCOL 등 5개 SASL env(kafkaSaslEnv 템플릿)가 자동
# 주입됨 - 여기서 직접 넣을 필요 없음. 아래 SPRING_KAFKA_BOOTSTRAP_SERVERS만
# 9093(SASL 리스너)로 같이 바꿔야 함.
kafka:
  sasl:
    enabled: true
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi
env:
  - name: SPRING_PROFILES_ACTIVE
    value: "dev"
  - name: SPRING_DATASOURCE_URL
    valueFrom:
      secretKeyRef:
        name: db-credentials
        key: SPRING_DATASOURCE_URL
  - name: SPRING_DATASOURCE_USERNAME
    valueFrom:
      secretKeyRef:
        name: db-credentials
        key: SPRING_DATASOURCE_USERNAME
  - name: SPRING_DATASOURCE_PASSWORD
    valueFrom:
      secretKeyRef:
        name: db-credentials
        key: SPRING_DATASOURCE_PASSWORD
  # Kafka SASL 6단계(2026-09-18) 반영으로 9093(SASL 리스너)로 갱신.
  - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
    value: "pet-subscription-kafka-kafka-bootstrap.kafka.svc:9093"
  - name: SPRING_KAFKA_CONSUMER_GROUP_ID
    value: "product-service.inventory-consumer"
  # OTel Java agent 기본 프로토콜(http/protobuf)이 쓰는 포트 4318로 맞춤 — 4317은 gRPC용.
  - name: OTEL_EXPORTER_OTLP_ENDPOINT
    value: "http://tempo.observability.svc.cluster.local:4318"
  - name: OTEL_METRICS_EXPORTER
    value: "none"
  - name: OTEL_LOGS_EXPORTER
    value: "none"
  # 로그-트레이스 상관연결용(2026-09-17, auth-service와 동일 이유).
  - name: LOGGING_PATTERN_LEVEL
    value: "%5p [${spring.application.name},trace_id=%X{trace_id:-},span_id=%X{span_id:-}]"
