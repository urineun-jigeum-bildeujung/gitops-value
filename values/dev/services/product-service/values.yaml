image:
  repository: 297165773875.dkr.ecr.ap-northeast-2.amazonaws.com/petflow/product-service
  tag: "fd249a4185ca555ab1b887df17a1a482cf6a5c31" # TODO: CI가 커밋 SHA 등 실제 빌드 태그를 넣도록 바뀌면 그걸로 교체
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    memory: 512Mi
env:
  - name: SPRING_PROFILES_ACTIVE
    value: "dev"
  - name: SPRING_DATASOURCE_URL
    valueFrom:
      secretKeyRef:
        name: db-credentials
        key: SPRING_DATASOURCE_URL
  - name: SPRING_DATASOURCE_USERNAME
    valueFrom:
      secretKeyRef:
        name: db-credentials
        key: SPRING_DATASOURCE_USERNAME
  - name: SPRING_DATASOURCE_PASSWORD
    valueFrom:
      secretKeyRef:
        name: db-credentials
        key: SPRING_DATASOURCE_PASSWORD
  - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
    value: "pet-subscription-kafka-kafka-bootstrap.kafka.svc:9092"
  - name: SPRING_KAFKA_CONSUMER_GROUP_ID
    value: "product-service.inventory-consumer"
