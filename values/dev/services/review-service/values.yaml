externalEgress:
  enabled: true
  runtime: java
  allowedDomains:
    - "petflow-dev-uploads.s3.ap-northeast-2.amazonaws.com"
# 서비스 간 mTLS 일관 적용(2026-09-20). auth/member/order-service와 동일 기준 —
# 서비스 간 HTTP 통신을 쓰는지 여부와 무관하게 전 서비스 공통 베이스라인으로 통일한다.
mtls:
  enabled: true
# 내부 Ingress/Egress 제한. mtls.enabled=true면 SERVER_PORT가 8443으로 바뀌어
# 실제 API 트래픽은 8443으로만 오가므로(8080은 관리/액추에이터 포트로 남음),
# api-gateway ingress도 8443으로 맞춘다.
networkPolicy:
  enabled: true
  namespaceDefaultDeny: true
  ingress:
    # 예정된 Gateway 배포는 아래 Namespace/라벨을 사용해야 한다.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: api-gateway
          podSelector:
            matchLabels:
              app.kubernetes.io/name: generic-service
              app.kubernetes.io/instance: dev-api-gateway
      ports:
        - protocol: TCP
          port: 8443
    # 메트릭 수집은 Prometheus Pod만 관리/API 포트에 접근하도록 허용한다.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
              app.kubernetes.io/instance: kube-prometheus-stack-prometheus
      ports:
        - protocol: TCP
          port: 8080
    # member-service의 ReviewClient가 내부 평점 조회를 호출할 때만 허용한다.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: member-service
          podSelector:
            matchLabels:
              app.kubernetes.io/name: generic-service
              app.kubernetes.io/instance: dev-member-service
      ports:
        - protocol: TCP
          port: 8443
  # 내부 경로만 명시한다. 외부 HTTPS는 externalEgress 전용 프록시로만 허용한다.
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: "kube-system"
          podSelector:
            matchLabels:
              k8s-app: "kube-dns"
      ports:
        - protocol: "UDP"
          port: 53
        - protocol: "TCP"
          port: 53
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: "observability"
          podSelector:
            matchLabels:
              app.kubernetes.io/name: "tempo"
              app.kubernetes.io/instance: "tempo"
      ports:
        - protocol: "TCP"
          port: 4318
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: "database"
          podSelector:
            matchLabels:
              cnpg.io/cluster: "petflow-db"
              cnpg.io/instanceRole: "primary"
      ports:
        - protocol: "TCP"
          port: 5432
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: "member-service"
          podSelector:
            matchLabels:
              app.kubernetes.io/name: "generic-service"
              app.kubernetes.io/instance: "dev-member-service"
      ports:
        - protocol: "TCP"
          port: 8443
    - to:
        - ipBlock:
            cidr: "169.254.170.23/32"
      ports:
        - protocol: "TCP"
          port: 80
image:
  repository: 297165773875.dkr.ecr.ap-northeast-2.amazonaws.com/petflow/review-service
  tag: "4982a238be86566cd59926183fb1dd6ac8f5c2f1" # TODO: CI가 커밋 SHA 등 실제 빌드 태그를 넣도록 바뀌면 그걸로 교체
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi
env:
  - name: SPRING_PROFILES_ACTIVE
    value: "dev"
  - name: SPRING_DATASOURCE_URL
    value: "jdbc:postgresql://petflow-db-rw.database.svc.cluster.local:5432/review_db"
  - name: SPRING_DATASOURCE_USERNAME
    valueFrom:
      secretKeyRef:
        name: db-credentials
        key: SPRING_DATASOURCE_USERNAME
  - name: SPRING_DATASOURCE_PASSWORD
    valueFrom:
      secretKeyRef:
        name: db-credentials
        key: SPRING_DATASOURCE_PASSWORD
  - name: SPRING_JPA_HIBERNATE_DDL_AUTO
    value: "update"
  # common-storage 필수값. CDN URL은 코드가 "/<prefix>/..."를 덧붙이므로
  # scheme을 포함하고 trailing slash는 두지 않는다.
  - name: STORAGE_BUCKET
    value: "petflow-dev-uploads"
  - name: STORAGE_REGION
    value: "ap-northeast-2"
  - name: STORAGE_CLOUDFRONT_DOMAIN
    value: "https://image.leechs.shop"
  - name: STORAGE_PREFIX
    value: "reviews"
  # OpenFeign annotation placeholder는 애플리케이션 기동 시 해석된다.
  - name: MEMBER_SERVICE_URL
    value: "https://generic-service.member-service.svc.cluster.local:8443"
  - name: ORDER_SERVICE_URL
    value: "https://generic-service.order-service.svc.cluster.local:8443"
  - name: PRODUCT_SERVICE_URL
    value: "https://generic-service.product-service.svc.cluster.local:8443"
  - name: INTERNAL_GATEWAY_SECRET
    valueFrom:
      secretKeyRef:
        name: gateway-secret
        key: INTERNAL_GATEWAY_SECRET
  # OTel Java agent 기본 프로토콜(http/protobuf)이 쓰는 포트 4318로 맞춤 — 4317은 gRPC용.
  - name: OTEL_EXPORTER_OTLP_ENDPOINT
    value: "http://tempo.observability.svc.cluster.local:4318"
  - name: OTEL_METRICS_EXPORTER
    value: "none"
  - name: OTEL_LOGS_EXPORTER
    value: "none"
  # 로그-트레이스 상관연결용(2026-09-17, auth-service와 동일 이유).
  - name: LOGGING_PATTERN_LEVEL
    value: "%5p [${spring.application.name},trace_id=%X{trace_id:-},span_id=%X{span_id:-}]"
