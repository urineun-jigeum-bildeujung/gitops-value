externalEgress:
  enabled: true
  runtime: java
  allowedDomains:
    - "api.tosspayments.com"
# 서비스 간 mTLS 일관 적용(2026-09-20). auth/member/order-service와 동일 기준 —
# 서비스 간 HTTP 통신을 쓰는지 여부와 무관하게 전 서비스 공통 베이스라인으로 통일한다.
# order-service 호출(RestClient + internal.gateway-secret)은 이번 변경 범위 밖이라
# 그대로 유지한다.
mtls:
  enabled: true
# 내부 Ingress/Egress 제한. mtls.enabled=true면 SERVER_PORT가 8443으로 바뀌어
# 실제 API 트래픽은 8443으로만 오가므로(8080은 관리/액추에이터 포트로 남음),
# api-gateway ingress도 8443으로 맞춘다.
networkPolicy:
  enabled: true
  namespaceDefaultDeny: true
  ingress:
    # 예정된 Gateway 배포는 아래 Namespace/라벨을 사용해야 한다.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: api-gateway
          podSelector:
            matchLabels:
              app.kubernetes.io/name: generic-service
              app.kubernetes.io/instance: dev-api-gateway
      ports:
        - protocol: TCP
          port: 8443
    # 메트릭 수집은 Prometheus Pod만 관리/API 포트에 접근하도록 허용한다.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
              app.kubernetes.io/instance: kube-prometheus-stack-prometheus
      ports:
        - protocol: TCP
          port: 8080
  # 내부 경로만 명시한다. 외부 HTTPS는 externalEgress 전용 프록시로만 허용한다.
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: "kube-system"
          podSelector:
            matchLabels:
              k8s-app: "kube-dns"
      ports:
        - protocol: "UDP"
          port: 53
        - protocol: "TCP"
          port: 53
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: "observability"
          podSelector:
            matchLabels:
              app.kubernetes.io/name: "tempo"
              app.kubernetes.io/instance: "tempo"
      ports:
        - protocol: "TCP"
          port: 4318
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: "database"
          podSelector:
            matchLabels:
              cnpg.io/cluster: "petflow-db"
              cnpg.io/instanceRole: "primary"
      ports:
        - protocol: "TCP"
          port: 5432
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: "kafka"
          podSelector:
            matchLabels:
              strimzi.io/cluster: "pet-subscription-kafka"
              strimzi.io/name: "pet-subscription-kafka-kafka"
              strimzi.io/kind: "Kafka"
              strimzi.io/broker-role: "true"
      ports:
        - protocol: "TCP"
          port: 9092
        - protocol: "TCP"
          port: 9093
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: "order-service"
          podSelector:
            matchLabels:
              app.kubernetes.io/name: "generic-service"
              app.kubernetes.io/instance: "dev-order-service"
      ports:
        - protocol: "TCP"
          port: 8443
image:
  repository: 297165773875.dkr.ecr.ap-northeast-2.amazonaws.com/petflow/payment-service
  tag: "0497001e943f9024a42ad9151ab588f00078df8b" # 재원복(2026-09-18) - 수동으로 원복했었는데, 오래 걸리던 Jenkins 빌드(#94)가 뒤늦게 완료되면서 jenkins-ci 자동 GitOps 커밋(e693da0)이 강제 503 태그로 다시 덮어씀. 시연용 임시 코드가 배포 태그로 자동 반영되는 건 원래 CI 정상 동작이라, 시연 끝나면 sever #94의 CanaryDemoHealthIndicator 자체를 revert하는 PR을 올려야 함(단순 태그 원복은 다음 Jenkins 빌드가 다시 덮어씀).
# 카나리/블루그린 롤백 시연(2026-09-18, gitops/docs/canary-bluegreen-rollback-scenario.md
# 설계 문서 실행 단계). payment-service는 잘못된 배포의 피해가 되돌릴 수 없는
# 성격(중복결제/정산오류)이라 카나리로 블래스트 레디어스를 최소화 - 문제를 트래픽
# 일부에서만 조기에 잡고 나머지는 구버전으로 안전하게 지킴.
# replicaCount 4 - 기본값 1로는 20%/50% 단계별 비율이 실제로 의미 없어짐(문서에
# 명시된 사전 준비 항목). 클러스터 CPU 여유가 빠듯해서(2026-09-18 확인, 전체
# 여유 1080m 중 이 작업으로 600m 사용) 문서 권장값(5~10)보다 낮춤 - 4개면
# 20%→1개(25%), 50%→2개(50%), 100%→4개로 단계 구분은 충분히 보임.
# 긴급 원복(2026-09-18) - 노드 장애 복구 중 Kafka 브로커가 클러스터 CPU 부족으로
# 스케줄 자체가 안 되는 상황 발생해서 급하게 1로 되돌림. 카나리 시연 재개 시
# 다시 필요한 만큼만 올릴 것.
replicaCount: 1
canary:
  enabled: true
  analysis:
    enabled: true
  steps:
    - setWeight: 20
    - pause: {duration: 60}
    - setWeight: 50
    - pause: {duration: 60}
    - setWeight: 100
# Kafka SASL 6단계(2026-09-18). generic-service 차트의 kafka.sasl.enabled를 켜면
# SPRING_KAFKA_SECURITY_PROTOCOL 등 5개 SASL env(kafkaSaslEnv 템플릿)가 자동
# 주입됨 - 여기서 직접 넣을 필요 없음. 아래 SPRING_KAFKA_BOOTSTRAP_SERVERS만
# 9093(SASL 리스너)로 같이 바꿔야 함. sever #87(SASL 조건부 클라이언트 설정)이
# 먼저 머지되어 있어야 함.
kafka:
  sasl:
    enabled: true
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi
env:
  - name: SPRING_PROFILES_ACTIVE
    value: "dev"
  # gitops PR #59(DB/gateway-secret ExternalSecret 바인딩)와 함께 반영 필요 - 그 전까지는
  # 이 Secret들이 존재하지 않아 크래시함(2026-09-18, sever #77 결제 API 배포 후 실제 발견).
  - name: SPRING_DATASOURCE_URL
    value: "jdbc:postgresql://petflow-db-rw.database.svc.cluster.local:5432/payment_db"
  - name: SPRING_DATASOURCE_USERNAME
    valueFrom:
      secretKeyRef:
        name: db-credentials
        key: SPRING_DATASOURCE_USERNAME
  - name: SPRING_DATASOURCE_PASSWORD
    valueFrom:
      secretKeyRef:
        name: db-credentials
        key: SPRING_DATASOURCE_PASSWORD
  - name: SPRING_JPA_HIBERNATE_DDL_AUTO
    value: "update"
  - name: INTERNAL_GATEWAY_SECRET
    valueFrom:
      secretKeyRef:
        name: gateway-secret
        key: INTERNAL_GATEWAY_SECRET
  # toss-payments.* 설정이 application-local.yml에만 있어서(dev 프로필엔 없음),
  # TossPaymentProperties 바인딩 자체가 실패해 부팅 크래시함(2026-09-18, sever #77
  # 결제 API 배포 후 실제 발견 - "toss-payments.base-url must use https://. 현재 값: null").
  # 임시값 - 토스페이먼츠가 공개 문서에 배포한 샌드박스 공용 테스트 시크릿 키
  # (누구나 결제 승인 테스트 가능, 실결제 불가). 팀 전용 실제 키 발급되면 교체 필요
  # ([[project_petflow_temp_placeholder_values]] 참고).
  - name: TOSS_PAYMENTS_SECRET_KEY
    value: "test_sk_D5GePWvyJnrK0W0k6q8gLzN97Eoq"
  # toss-payments.base-url도 위와 같은 이유로 dev 프로필엔 없음 - TossPaymentProperties의
  # https:// 검증에 걸려 secret-key만으로는 안 풀리고 이 값도 같이 필요함
  # (2026-09-18, TOSS_SECRET_KEY 추가 후 재검증 중 새로 드러남).
  - name: TOSS_PAYMENTS_BASE_URL
    value: "https://api.tosspayments.com"
  # spring.kafka.bootstrap-servers 기본값이 localhost:9092라 크래시는 안 하지만, 이 값을
  # 안 넘기면 결제 완료/실패 이벤트가 실제로 발행되지 않고 조용히 로컬 연결 실패함.
  # Kafka SASL 6단계(2026-09-18) 반영으로 9093(SASL 리스너)로 갱신.
  - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
    value: "pet-subscription-kafka-kafka-bootstrap.kafka.svc:9093"
  # KafkaConsumerConfig와 PaymentCancellationConsumer가 함께 사용하는 기존 계약.
  # 새 group-id를 임의로 만들지 않고 application-local.yml 및 @KafkaListener의
  # payment-service.refund-consumer와 동일하게 유지한다. 최초 기동 시 기존 group
  # offset이 없으므로 코드의 auto.offset.reset=earliest가 적용될 수 있다.
  - name: SPRING_KAFKA_CONSUMER_GROUP_ID
    value: "payment-service.refund-consumer"
  # OTel Java agent 기본 프로토콜(http/protobuf)이 쓰는 포트 4318로 맞춤 — 4317은 gRPC용.
  - name: OTEL_EXPORTER_OTLP_ENDPOINT
    value: "http://tempo.observability.svc.cluster.local:4318"
  - name: OTEL_METRICS_EXPORTER
    value: "none"
  - name: OTEL_LOGS_EXPORTER
    value: "none"
  # 로그-트레이스 상관연결용(2026-09-17, auth-service와 동일 이유).
  - name: LOGGING_PATTERN_LEVEL
    value: "%5p [${spring.application.name},trace_id=%X{trace_id:-},span_id=%X{span_id:-}]"
