# ApplicationSet은 _로 시작하는 디렉터리를 제외한다.
# 이미지/명령/스케줄을 확정한 후 repurchase로 이름을 바꾸고 CronJob을 추가한다.
deployment:
  enabled: false
service:
  enabled: false
metrics:
  enabled: false
ingress:
  enabled: false
autoscaling:
  enabled: false
# 현재 DB용 NetworkPolicy는 gitops platform/60-cnpg-cluster에서 관리한다.
networkPolicy:
  enabled: false
env:
  - name: DB_HOST
    value: petflow-db-rw.database.svc.cluster.local
  - name: DB_PORT
    value: "5432"
  - name: DB_NAME
    value: repurchase_db
  - name: DB_USER
    valueFrom:
      secretKeyRef:
        name: db-credentials
        key: DB_USER
  - name: DB_PASSWORD
    valueFrom:
      secretKeyRef:
        name: db-credentials
        key: DB_PASSWORD
cronJobs: []
