# 내부 Ingress/Egress 제한. mTLS・SASL 설정은 변경하지 않는다.
networkPolicy:
  enabled: true
  namespaceDefaultDeny: true
  ingress:
    # 예정된 Gateway 배포는 아래 Namespace/라벨을 사용해야 한다.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: api-gateway
          podSelector:
            matchLabels:
              app.kubernetes.io/name: generic-service
              app.kubernetes.io/instance: dev-api-gateway
      ports:
        - protocol: TCP
          port: 8443
    # 메트릭 수집은 Prometheus Pod만 관리/API 포트에 접근하도록 허용한다.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
              app.kubernetes.io/instance: kube-prometheus-stack-prometheus
      ports:
        - protocol: TCP
          port: 8080
    # 코드상 필요한 서비스 간 호출. 호출 URL/mTLS 구현은 별도 담당한다.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: payment-service
          podSelector:
            matchLabels:
              app.kubernetes.io/name: generic-service
              app.kubernetes.io/instance: dev-payment-service
      ports:
        - protocol: TCP
          port: 8443

  # 확정된 외부 목적지가 없어 인터넷 연결은 차단한다. 내부 경로만 허용한다.
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: "kube-system"
          podSelector:
            matchLabels:
              k8s-app: "kube-dns"
      ports:
        - protocol: "UDP"
          port: 53
        - protocol: "TCP"
          port: 53
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: "observability"
          podSelector:
            matchLabels:
              app.kubernetes.io/name: "tempo"
              app.kubernetes.io/instance: "tempo"
      ports:
        - protocol: "TCP"
          port: 4318
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: "database"
          podSelector:
            matchLabels:
              cnpg.io/cluster: "petflow-db"
              cnpg.io/instanceRole: "primary"
      ports:
        - protocol: "TCP"
          port: 5432
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: "redis"
          podSelector:
            matchLabels:
              app.kubernetes.io/name: "redis"
              app.kubernetes.io/instance: "redis"
              app.kubernetes.io/component: "master"
      ports:
        - protocol: "TCP"
          port: 6379
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: "kafka"
          podSelector:
            matchLabels:
              strimzi.io/cluster: "pet-subscription-kafka"
              strimzi.io/name: "pet-subscription-kafka-kafka"
              strimzi.io/kind: "Kafka"
              strimzi.io/broker-role: "true"
      ports:
        - protocol: "TCP"
          port: 9092
        - protocol: "TCP"
          port: 9093
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: "product-service"
          podSelector:
            matchLabels:
              app.kubernetes.io/name: "generic-service"
              app.kubernetes.io/instance: "dev-product-service"
      ports:
        - protocol: "TCP"
          port: 8080
image:
  repository: 297165773875.dkr.ecr.ap-northeast-2.amazonaws.com/petflow/order-service
  tag: "b00f5931146c5bf8f7fa224255e4051df972a92d" # TODO: CI가 커밋 SHA 등 실제 빌드 태그를 넣도록 바뀌면 그걸로 교체
# 서비스 간 mTLS 4단계 검증 대상(2026-09-17). order-service는 Feign으로 다른 서비스를
# 호출하는 코드가 없어서 sever #73(Feign 클라이언트 mTLS 설정) 머지를 기다릴 필요
# 없이 먼저 켤 수 있음 — server.ssl.*/spring.ssl.bundle.pem.*는 Spring Boot 자체
# 내장 기능이라 지금 배포된 이미지에도 이미 있음. 서버 쪽(8443/mTLS 필수)이 실제로
# 막고 있는지만 검증하는 단계.
mtls:
  enabled: true
# Kafka SASL 6단계(2026-09-18). generic-service 차트의 kafka.sasl.enabled를 켜면
# SPRING_KAFKA_SECURITY_PROTOCOL 등 5개 SASL env(kafkaSaslEnv 템플릿)가 자동
# 주입됨 - 여기서 직접 넣을 필요 없음. 아래 SPRING_KAFKA_BOOTSTRAP_SERVERS만
# 9093(SASL 리스너)로 같이 바꿔야 함(9092 평문 리스너로는 SASL 핸드셰이크 자체가
# 안 됨).
kafka:
  sasl:
    enabled: true
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi
env:
  - name: SPRING_PROFILES_ACTIVE
    value: "dev"
  - name: SPRING_DATASOURCE_URL
    value: "jdbc:postgresql://petflow-db-rw.database.svc.cluster.local:5432/order_db"
  - name: SPRING_DATASOURCE_USERNAME
    valueFrom:
      secretKeyRef:
        name: db-credentials
        key: SPRING_DATASOURCE_USERNAME
  - name: SPRING_DATASOURCE_PASSWORD
    valueFrom:
      secretKeyRef:
        name: db-credentials
        key: SPRING_DATASOURCE_PASSWORD
  - name: SPRING_JPA_HIBERNATE_DDL_AUTO
    value: "update"
  - name: INTERNAL_GATEWAY_SECRET
    valueFrom:
      secretKeyRef:
        name: gateway-secret
        key: INTERNAL_GATEWAY_SECRET
  # spring.kafka.bootstrap-servers가 application-local.yml에만 있어서(dev 프로필엔
  # 없음), PaymentResultConsumer/KafkaProducerConfig가 이 프로퍼티를 못 찾아
  # PlaceholderResolutionException으로 부팅 자체가 실패함(2026-09-18, 클러스터 복구
  # 후 실제 크래시로 발견 — member-service breed_master, order_number_seq와 동일
  # 유형의 반복 버그). Kafka SASL 6단계(2026-09-18) 반영으로 9093(SASL 리스너)로 갱신.
  - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
    value: "pet-subscription-kafka-kafka-bootstrap.kafka.svc:9093"
  # spring.kafka.consumer.group-id도 위와 같은 이유(application-local.yml에만 있고
  # dev 프로필엔 없음)로 KafkaConsumerConfig의 @Value 주입이 실패해 부팅이 죽음
  # (2026-09-18, bootstrap-servers 수정 후 재검증 중 새로 드러남). product-service의
  # SPRING_KAFKA_CONSUMER_GROUP_ID와 같은 명명 규칙을 따름.
  - name: SPRING_KAFKA_CONSUMER_GROUP_ID
    value: "order-service.order-status-consumer"
  # spring.sql.init.mode: always가 application-local.yml에만 있어서(dev 프로필엔 없음),
  # schema.sql(order_number_seq 시퀀스 생성)이 dev 클러스터에서 한 번도 실행 안 됐을
  # 가능성이 높음 — Spring Boot 기본값은 외부 DB(Postgres 등)엔 schema.sql을 자동
  # 실행하지 않음. OrderRepositoryAdapter.generateOrderNumber()가 nextval('order_number_seq')를
  # 직접 호출하므로, 시퀀스가 없으면 주문 생성이 실패함(member-service breed_master와
  # 동일 유형, 2026-09-17 코드 검토로 발견 — 클러스터 재기동 후 실제 검증 필요).
  # schema.sql이 CREATE SEQUENCE IF NOT EXISTS라 매 재시작마다 실행돼도 안전함.
  - name: SPRING_SQL_INIT_MODE
    value: "always"
  # spring.data.redis.host/port 접속 정보가 application-local.yml에만 있어서(dev 프로필엔
  # 없음), 여기서 안 넘기면 기본값 localhost:6379로 접속을 시도하다 Connection refused ->
  # Redis 헬스 인디케이터 DOWN -> /actuator/health가 계속 503을 반환함(2026-09-17 Golden
  # Signals 대시보드 캡처 중 5xx 에러율 100%로 실제 발견).
  - name: SPRING_DATA_REDIS_HOST
    value: "redis-master.redis.svc.cluster.local"
  - name: SPRING_DATA_REDIS_PORT
    value: "6379"
  # Redis mTLS 4단계(2026-09-18). order-service는 이미 HTTP mTLS용 internalmtls
  # SslBundle(mtls.enabled: true 위에서 만들어짐)을 갖고 있어서, 새 인증서/볼륨 없이
  # 그 번들 이름만 재사용하면 됨(Spring Boot 4.1.0 spring-boot-data-redis 모듈의
  # LettuceConnectionConfiguration이 SslBundle을 그대로 받아서 Lettuce SslOptions에
  # 꽂아주는 것까지 jar 직접 확인함). gitops PR #52(Redis 서버 tls.enabled)가
  # 머지되기 전까지는 이 값을 반영하면 안 됨 - 서버가 아직 평문이라 핸드셰이크 실패로
  # 즉시 깨짐. 클러스터 복구 시점에 PR #52와 반드시 함께 반영할 것.
  #
  # 번들 이름은 하이픈 없는 internalmtls를 씀(2026-09-18) - "internal-mtls"로 했다가
  # 실제 Pod 크래시(NoSuchSslBundleException)로 발견: spring.ssl.bundle.pem.<이름>이
  # Map 동적 키라 환경변수의 "_"→"." 변환 과정에서 하이픈이 두 단계 경로로 잘못
  # 쪼개짐. gitops PR #57/sever #79에서 같은 이름으로 맞춤.
  - name: SPRING_DATA_REDIS_SSL_ENABLED
    value: "true"
  - name: SPRING_DATA_REDIS_SSL_BUNDLE
    value: "internalmtls"
  # OTel Java agent 기본 프로토콜(http/protobuf)이 쓰는 포트 4318로 맞춤 — 4317은 gRPC용.
  - name: OTEL_EXPORTER_OTLP_ENDPOINT
    value: "http://tempo.observability.svc.cluster.local:4318"
  - name: OTEL_METRICS_EXPORTER
    value: "none"
  - name: OTEL_LOGS_EXPORTER
    value: "none"
  # 로그-트레이스 상관연결용(2026-09-17, auth-service와 동일 이유).
  - name: LOGGING_PATTERN_LEVEL
    value: "%5p [${spring.application.name},trace_id=%X{trace_id:-},span_id=%X{span_id:-}]"
