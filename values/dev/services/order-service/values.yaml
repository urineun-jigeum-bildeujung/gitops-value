image:
  repository: 297165773875.dkr.ecr.ap-northeast-2.amazonaws.com/petflow/order-service
  tag: "2a1cb2accf259596bd736b91375e11a79fea9677" # TODO: CI가 커밋 SHA 등 실제 빌드 태그를 넣도록 바뀌면 그걸로 교체
# 서비스 간 mTLS 4단계 검증 대상(2026-09-17). order-service는 Feign으로 다른 서비스를
# 호출하는 코드가 없어서 sever #73(Feign 클라이언트 mTLS 설정) 머지를 기다릴 필요
# 없이 먼저 켤 수 있음 — server.ssl.*/spring.ssl.bundle.pem.*는 Spring Boot 자체
# 내장 기능이라 지금 배포된 이미지에도 이미 있음. 서버 쪽(8443/mTLS 필수)이 실제로
# 막고 있는지만 검증하는 단계.
mtls:
  enabled: true
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi
env:
  - name: SPRING_PROFILES_ACTIVE
    value: "dev"
  - name: SPRING_DATASOURCE_URL
    valueFrom:
      secretKeyRef:
        name: db-credentials
        key: SPRING_DATASOURCE_URL
  - name: SPRING_DATASOURCE_USERNAME
    valueFrom:
      secretKeyRef:
        name: db-credentials
        key: SPRING_DATASOURCE_USERNAME
  - name: SPRING_DATASOURCE_PASSWORD
    valueFrom:
      secretKeyRef:
        name: db-credentials
        key: SPRING_DATASOURCE_PASSWORD
  - name: INTERNAL_GATEWAY_SECRET
    valueFrom:
      secretKeyRef:
        name: gateway-secret
        key: INTERNAL_GATEWAY_SECRET
  # spring.sql.init.mode: always가 application-local.yml에만 있어서(dev 프로필엔 없음),
  # schema.sql(order_number_seq 시퀀스 생성)이 dev 클러스터에서 한 번도 실행 안 됐을
  # 가능성이 높음 — Spring Boot 기본값은 외부 DB(Postgres 등)엔 schema.sql을 자동
  # 실행하지 않음. OrderRepositoryAdapter.generateOrderNumber()가 nextval('order_number_seq')를
  # 직접 호출하므로, 시퀀스가 없으면 주문 생성이 실패함(member-service breed_master와
  # 동일 유형, 2026-09-17 코드 검토로 발견 — 클러스터 재기동 후 실제 검증 필요).
  # schema.sql이 CREATE SEQUENCE IF NOT EXISTS라 매 재시작마다 실행돼도 안전함.
  - name: SPRING_SQL_INIT_MODE
    value: "always"
  # spring.data.redis.host/port 접속 정보가 application-local.yml에만 있어서(dev 프로필엔
  # 없음), 여기서 안 넘기면 기본값 localhost:6379로 접속을 시도하다 Connection refused ->
  # Redis 헬스 인디케이터 DOWN -> /actuator/health가 계속 503을 반환함(2026-09-17 Golden
  # Signals 대시보드 캡처 중 5xx 에러율 100%로 실제 발견).
  - name: SPRING_DATA_REDIS_HOST
    value: "redis-master.redis.svc.cluster.local"
  - name: SPRING_DATA_REDIS_PORT
    value: "6379"
  # OTel Java agent 기본 프로토콜(http/protobuf)이 쓰는 포트 4318로 맞춤 — 4317은 gRPC용.
  - name: OTEL_EXPORTER_OTLP_ENDPOINT
    value: "http://tempo.observability.svc.cluster.local:4318"
  - name: OTEL_METRICS_EXPORTER
    value: "none"
  - name: OTEL_LOGS_EXPORTER
    value: "none"
  # 로그-트레이스 상관연결용(2026-09-17, auth-service와 동일 이유).
  - name: LOGGING_PATTERN_LEVEL
    value: "%5p [${spring.application.name},trace_id=%X{trace_id:-},span_id=%X{span_id:-}]"
