image:
  repository: 297165773875.dkr.ecr.ap-northeast-2.amazonaws.com/petflow/auth-service
  tag: "a9afe5c37bcb5fd15984b553d05f884f69431b1e" # TODO: CI가 커밋 SHA 등 실제 빌드 태그를 넣도록 바뀌면 그걸로 교체
# 서비스 간 mTLS 5단계(2026-09-18). auth-service -> member-service Feign 호출(MemberClient)이
# 실제로 있어서 order-service와 달리 sever #73(Feign 클라이언트 mTLS 설정) 머지 및 재배포가
# 선행되어야 함 — 그 전에 이 mtls.enabled/MEMBER_SERVICE_URL만 먼저 적용하면 Feign이 아직
# 평범한 HTTP 클라이언트라 mTLS 핸드셰이크를 못 해서 즉시 연결 실패함. member-service의
# mtls.enabled도 반드시 같은 타이밍에 켜져 있어야 함(한쪽만 켜져 있으면 8443 포트 자체가
# 없는 쪽으로 https 호출 시 연결 실패).
mtls:
  enabled: true
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi
env:
  - name: SPRING_PROFILES_ACTIVE
    value: "dev"
  - name: SPRING_DATASOURCE_URL
    valueFrom:
      secretKeyRef:
        name: db-credentials
        key: SPRING_DATASOURCE_URL
  - name: SPRING_DATASOURCE_USERNAME
    valueFrom:
      secretKeyRef:
        name: db-credentials
        key: SPRING_DATASOURCE_USERNAME
  - name: SPRING_DATASOURCE_PASSWORD
    valueFrom:
      secretKeyRef:
        name: db-credentials
        key: SPRING_DATASOURCE_PASSWORD
  # member-service.url 프로퍼티 오버라이드. SystemEnvironmentPropertySource는 점(.)과
  # 대시(-) 둘 다 언더스코어 하나로 치환해서 매칭하므로 그냥 MEMBER_SERVICE_URL이 맞다
  # (처음에 __로 시도했다가 실제 로그로 확인 후 정정, 2026-09-14).
  - name: MEMBER_SERVICE_URL
    value: "https://generic-service.member-service.svc.cluster.local:8443"
  - name: JWT_RSA_PRIVATE_KEY
    valueFrom:
      secretKeyRef:
        name: jwt-credentials
        key: JWT_RSA_PRIVATE_KEY
  - name: INTERNAL_GATEWAY_SECRET
    valueFrom:
      secretKeyRef:
        name: gateway-secret
        key: INTERNAL_GATEWAY_SECRET
  - name: JWT_EXPIRATION_ACCESS
    value: "3600"
  - name: JWT_EXPIRATION_REFRESH
    value: "604800"
  # spring.data.redis.host/port 접속 정보가 application-local.yml에만 있어서(dev 프로필엔
  # 없음), 여기서 안 넘기면 기본값 localhost:6379로 접속을 시도하다 Connection refused ->
  # Redis 헬스 인디케이터 DOWN -> /actuator/health가 계속 503을 반환함(order-service와
  # 동일 원인, 2026-09-17 발견 — auth-service는 OAuth2 크래시에 가려서 안 보였을 뿐).
  - name: SPRING_DATA_REDIS_HOST
    value: "redis-master.redis.svc.cluster.local"
  - name: SPRING_DATA_REDIS_PORT
    value: "6379"
  # 임시 추정값(2026-09-16) — 프론트엔드가 아직 /auth/callback 페이지를 안 만든 상태라
  # 확정된 값 아님. web README(src/views/login/README.md)에 적힌 계획 경로를 그대로
  # 가져다 씀. 소셜로그인 화면이 실제로 만들어지면 재확인 필요.
  - name: OAUTH2_FRONTEND_REDIRECT_URI
    value: "https://leechs.shop/auth/callback"
  # 임시값(2026-09-18) — 카카오/구글 OAuth2 client-id/secret이 아직 실제로 발급/등록되지
  # 않은 상태. application-local.yml에만 이 값들이 있고 dev 프로필엔 없어서
  # ClientRegistrationRepository 빈을 못 만들어 매 부팅마다 크래시했음(SecurityConfig가
  # .oauth2Login(...)을 무조건 걸어놔서 회피 불가). Spring은 부팅 시점엔 client-id/secret이
  # "진짜 유효한지"는 검증하지 않고 문자열만 있으면 빈을 만들어주므로, mTLS 검증 등 다른
  # 작업을 진행할 수 있게 크래시만 우선 해소하는 더미값. 실제 카카오/구글 로그인은 이
  # 값으로는 동작하지 않음 — 실제 앱 등록 후 반드시 교체 필요
  # ([[project_petflow_temp_placeholder_values]] 참고).
  - name: SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_KAKAO_CLIENT_ID
    value: "placeholder-kakao-client-id"
  - name: SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_KAKAO_CLIENT_SECRET
    value: "placeholder-kakao-client-secret"
  - name: SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_KAKAO_REDIRECT_URI
    value: "https://leechs.shop/api/auth/login/oauth2/code/kakao"
  - name: SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_KAKAO_AUTHORIZATION_GRANT_TYPE
    value: "authorization_code"
  - name: SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_KAKAO_CLIENT_AUTHENTICATION_METHOD
    value: "client_secret_post"
  - name: SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_KAKAO_SCOPE
    value: "account_email"
  - name: SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_KAKAO_AUTHORIZATION_URI
    value: "https://kauth.kakao.com/oauth/authorize"
  - name: SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_KAKAO_TOKEN_URI
    value: "https://kauth.kakao.com/oauth/token"
  - name: SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_KAKAO_USER_INFO_URI
    value: "https://kapi.kakao.com/v2/user/me"
  - name: SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_KAKAO_USER_NAME_ATTRIBUTE
    value: "id"
  # google은 Spring Security 내장 CommonOAuth2Provider라 provider.* 없이 client-id/secret만
  # 있으면 authorization-uri 등이 자동으로 채워짐.
  - name: SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_ID
    value: "placeholder-google-client-id"
  - name: SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_SECRET
    value: "placeholder-google-client-secret"
  - name: SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_REDIRECT_URI
    value: "https://leechs.shop/api/auth/login/oauth2/code/google"
  - name: SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_AUTHORIZATION_GRANT_TYPE
    value: "authorization_code"
  - name: SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_SCOPE
    value: "email"
  # OTel Java agent 기본 프로토콜(http/protobuf)이 쓰는 포트 4318로 맞춤 — 4317은 gRPC용.
  - name: OTEL_EXPORTER_OTLP_ENDPOINT
    value: "http://tempo.observability.svc.cluster.local:4318"
  - name: OTEL_METRICS_EXPORTER
    value: "none"
  - name: OTEL_LOGS_EXPORTER
    value: "none"
  # 로그-트레이스 상관연결용(2026-09-17). 기본 로그 패턴엔 trace_id가 안 찍혀서 Grafana에서
  # 로그↔트레이스를 못 이어줬음. OTel Java agent가 MDC에 채워주는 trace_id/span_id를
  # 로그 패턴에 노출 — Grafana Loki datasource의 derivedFields(matcherRegex)가 이 값을
  # 찾아서 Tempo 링크를 만든다.
  - name: LOGGING_PATTERN_LEVEL
    value: "%5p [${spring.application.name},trace_id=%X{trace_id:-},span_id=%X{span_id:-}]"
