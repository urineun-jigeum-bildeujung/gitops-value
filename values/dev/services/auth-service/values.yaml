image:
  repository: 297165773875.dkr.ecr.ap-northeast-2.amazonaws.com/petflow/auth-service
  tag: "c3b2860f609667f3a099c05e7d3df2fe48940aea" # TODO: CI가 커밋 SHA 등 실제 빌드 태그를 넣도록 바뀌면 그걸로 교체
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    memory: 256Mi
env:
  - name: SPRING_PROFILES_ACTIVE
    value: "dev"
  - name: SPRING_DATASOURCE_URL
    valueFrom:
      secretKeyRef:
        name: db-credentials
        key: SPRING_DATASOURCE_URL
  - name: SPRING_DATASOURCE_USERNAME
    valueFrom:
      secretKeyRef:
        name: db-credentials
        key: SPRING_DATASOURCE_USERNAME
  - name: SPRING_DATASOURCE_PASSWORD
    valueFrom:
      secretKeyRef:
        name: db-credentials
        key: SPRING_DATASOURCE_PASSWORD
  # member-service.url 프로퍼티 오버라이드. SystemEnvironmentPropertySource는 점(.)과
  # 대시(-) 둘 다 언더스코어 하나로 치환해서 매칭하므로 그냥 MEMBER_SERVICE_URL이 맞다
  # (처음에 __로 시도했다가 실제 로그로 확인 후 정정, 2026-09-14).
  - name: MEMBER_SERVICE_URL
    value: "http://generic-service.member-service.svc.cluster.local"
  - name: JWT_RSA_PRIVATE_KEY
    valueFrom:
      secretKeyRef:
        name: jwt-credentials
        key: JWT_RSA_PRIVATE_KEY
  - name: INTERNAL_GATEWAY_SECRET
    valueFrom:
      secretKeyRef:
        name: gateway-secret
        key: INTERNAL_GATEWAY_SECRET
