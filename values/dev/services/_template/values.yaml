# 새 서비스 추가 시 이 폴더를 복사해서 시작하세요.
# `_`로 시작하는 폴더는 appset.yaml의 git generator에서 exclude되어 Application이
# 생성되지 않습니다 — 템플릿 보관용 폴더.
#
# 여기 없는 값은 gitops 레포 charts/generic-service/values.yaml의 기본값을 그대로 씁니다.

image:
  repository: 297165773875.dkr.ecr.ap-northeast-2.amazonaws.com/petflow/<service-name>
  tag: "latest" # TODO: CI가 커밋 SHA 등 실제 빌드 태그를 넣도록 바뀌면 그걸로 교체

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    memory: 256Mi

env:
  - name: SPRING_PROFILES_ACTIVE
    value: "dev"

# 필요한 서비스만 아래 옵션을 켜세요.
# autoscaling:
#   enabled: true
# canary:
#   enabled: true
# ingress:
#   enabled: true
#   host: <service-name>.example.com
