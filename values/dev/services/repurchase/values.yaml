# ApplicationSet이 dev-repurchase를 생성하여 S3 프록시와 네트워크 정책을 관리한다.
# 이미지 태그 갱신마다 새 이름의 대기 SHADOW Job을 준비한다. 정기 실행은 비활성 상태다.
# 수동 Job은 serviceAccountName: generic-service를 사용한다.
# Pod 라벨은 generic-service/dev-repurchase 또는 role: repurchase-shadow를 사용한다.
# ServiceAccount는 gitops platform/60-cnpg-cluster에서 선행 생성한다.
image: {pullPolicy: IfNotPresent, repository: 297165773875.dkr.ecr.ap-northeast-2.amazonaws.com/petflow/repurchase, tag: 40bf15d529aba85e2ba5ec9ee32484327478e785}
serviceAccount:
  create: false
deployment:
  enabled: false
service:
  enabled: false
metrics:
  enabled: false
ingress:
  enabled: false
autoscaling:
  enabled: false
# platform의 DB/DNS 허용 정책에 더해 Helm이 S3 프록시 경로를 준비한다.
networkPolicy:
  enabled: true
  namespaceDefaultDeny: true
  ingress: []
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: database
          podSelector:
            matchLabels:
              cnpg.io/cluster: petflow-db
      ports:
        - protocol: TCP
          port: 5432
    # AWS 지정 고정 IPv4 Pod Identity 주소. NO_PROXY로 직접 연결한다.
    - to:
        - ipBlock:
            cidr: 169.254.170.23/32
      ports:
        - protocol: TCP
          port: 80
externalEgress:
  enabled: true
  runtime: python
  allowedDomains:
    - petflow-dev-ml-artifacts.s3.ap-northeast-2.amazonaws.com
env:
  - name: AWS_REGION
    value: ap-northeast-2
  - name: AWS_DEFAULT_REGION
    value: ap-northeast-2
  - name: DB_HOST
    value: petflow-db-rw.database.svc.cluster.local
  - name: DB_PORT
    value: "5432"
  - name: DB_NAME
    value: repurchase_db
  - name: DB_USER
    valueFrom:
      secretKeyRef:
        name: db-credentials
        key: DB_USER
  - name: DB_PASSWORD
    valueFrom:
      secretKeyRef:
        name: db-credentials
        key: DB_PASSWORD
cronJobs: []
# image가 없는 컨테이너는 최상위 image를 사용한다(batch/verify-model).
# AWS CLI 이미지는 고정하고 프록시 env는 차트가 모든 컨테이너에 주입한다.
# 실행 설정은 기존 검증 값으로 시작한다. 새 실행 전 시각/ID를 합의하여 수정한다.
manualJobs:
  - activeDeadlineSeconds: 1800
    backoffLimit: 0
    name: repurchase-shadow
    podLabels: {role: repurchase-shadow}
    podSpec:
      containers:
        - args: [shadow-run, --model-directory, /models/xgboost_aft, --artifact-id, ec25eb1bcd8f24ce36a2397c1544cb087cb970af532365de7f8ec900aeb4b7fb, --as-of, $(REPURCHASE_AS_OF), --created-at, $(REPURCHASE_CREATED_AT), --publication-id, $(REPURCHASE_PUBLICATION_ID), --window-days, '30', --allow-shadow-write]
          env:
            - {name: AWS_REGION, value: ap-northeast-2}
            - {name: AWS_DEFAULT_REGION, value: ap-northeast-2}
            - name: REPURCHASE_ORDER_DATABASE_DSN
              valueFrom:
                secretKeyRef: {key: REPURCHASE_ORDER_DATABASE_DSN, name: repurchase-shadow-dsns}
            - name: REPURCHASE_MEMBER_DATABASE_DSN
              valueFrom:
                secretKeyRef: {key: REPURCHASE_MEMBER_DATABASE_DSN, name: repurchase-shadow-dsns}
            - name: REPURCHASE_RESULT_DATABASE_DSN
              valueFrom:
                secretKeyRef: {key: REPURCHASE_RESULT_DATABASE_DSN, name: repurchase-shadow-dsns}
            - {name: REPURCHASE_AS_OF, value: '2026-10-03T11:03:00Z'}
            - {name: REPURCHASE_CREATED_AT, value: '2026-10-04T06:52:40Z'}
            - {name: REPURCHASE_PUBLICATION_ID, value: shadow-eks-20261003T110300Z-ec25eb1b-v1}
          name: batch
          resources:
            limits: {cpu: '1', memory: 1Gi}
            requests: {cpu: 100m, memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - {mountPath: /models/xgboost_aft, name: models, readOnly: true}
      initContainers:
        - args: [s3, cp, 's3://petflow-dev-ml-artifacts/repurchase/ec25eb1bcd8f24ce36a2397c1544cb087cb970af532365de7f8ec900aeb4b7fb/manifest.json', /models/xgboost_aft/manifest.json, --region, ap-northeast-2, --only-show-errors]
          command: [aws]
          env:
            - {name: AWS_REGION, value: ap-northeast-2}
            - {name: AWS_DEFAULT_REGION, value: ap-northeast-2}
            - {name: AWS_EC2_METADATA_DISABLED, value: 'true'}
            - {name: AWS_PAGER, value: ''}
          image: public.ecr.aws/aws-cli/aws-cli:2.27.41
          name: download-manifest
          resources:
            limits: {cpu: 500m, memory: 256Mi}
            requests: {cpu: 50m, memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - {mountPath: /models/xgboost_aft, name: models, readOnly: false}
        - args: [s3, cp, 's3://petflow-dev-ml-artifacts/repurchase/ec25eb1bcd8f24ce36a2397c1544cb087cb970af532365de7f8ec900aeb4b7fb/model.json', /models/xgboost_aft/model.json, --region, ap-northeast-2, --only-show-errors]
          command: [aws]
          env:
            - {name: AWS_REGION, value: ap-northeast-2}
            - {name: AWS_DEFAULT_REGION, value: ap-northeast-2}
            - {name: AWS_EC2_METADATA_DISABLED, value: 'true'}
            - {name: AWS_PAGER, value: ''}
          image: public.ecr.aws/aws-cli/aws-cli:2.27.41
          name: download-model
          resources:
            limits: {cpu: 500m, memory: 256Mi}
            requests: {cpu: 50m, memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - {mountPath: /models/xgboost_aft, name: models, readOnly: false}
        - args:
            - |
              from pathlib import Path
              import hashlib, json
              root = Path('/models/xgboost_aft')
              manifest_bytes = (root / 'manifest.json').read_bytes()
              assert hashlib.sha256(manifest_bytes).hexdigest() == '94eaf7e9fd0ba37bce0ce2d8e67069611b980548d59bcdca8df82a0fdbfdc4a1', 'manifest SHA-256 mismatch'
              manifest = json.loads(manifest_bytes)
              assert manifest['artifact_id'] == 'ec25eb1bcd8f24ce36a2397c1544cb087cb970af532365de7f8ec900aeb4b7fb', 'artifact ID mismatch'
              assert manifest['model_filename'] == 'model.json', 'unexpected model filename'
              assert hashlib.sha256((root / 'model.json').read_bytes()).hexdigest() == manifest['model_sha256'], 'model SHA-256 mismatch'
              from scripts.modeling.artifacts import load_model_artifact
              model = load_model_artifact(root)
              assert model.artifact_id == 'ec25eb1bcd8f24ce36a2397c1544cb087cb970af532365de7f8ec900aeb4b7fb', 'loaded model ID mismatch'
              print(json.dumps({'event': 'repurchase_model_loaded', 'artifact_id': model.artifact_id, 'model_sha256': manifest['model_sha256']}))
          command: [python, -c]
          env:
            - {name: AWS_REGION, value: ap-northeast-2}
            - {name: AWS_DEFAULT_REGION, value: ap-northeast-2}
          name: verify-model
          resources:
            limits: {cpu: '1', memory: 1Gi}
            requests: {cpu: 100m, memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - {mountPath: /models/xgboost_aft, name: models, readOnly: true}
      restartPolicy: Never
      securityContext:
        fsGroup: 10001
        runAsGroup: 10001
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: {type: RuntimeDefault}
      serviceAccountName: generic-service
      volumes:
        - emptyDir: {sizeLimit: 128Mi}
          name: models
