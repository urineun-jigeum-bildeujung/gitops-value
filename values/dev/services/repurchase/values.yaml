# ApplicationSet이 dev-repurchase를 생성하여 S3 프록시와 네트워크 정책을 관리한다.
# 이미지/명령/스케줄을 확정한 후 CronJob을 추가한다. 현재 정기 실행은 비활성 상태다.
# 수동 Job은 serviceAccountName: generic-service를 사용한다.
# Pod 라벨은 generic-service/dev-repurchase 또는 role: repurchase-shadow를 사용한다.
# ServiceAccount는 gitops platform/60-cnpg-cluster에서 선행 생성한다.
serviceAccount:
  create: false
deployment:
  enabled: false
service:
  enabled: false
metrics:
  enabled: false
ingress:
  enabled: false
autoscaling:
  enabled: false
# platform의 DB/DNS 허용 정책에 더해 Helm이 S3 프록시 경로를 준비한다.
networkPolicy:
  enabled: true
  namespaceDefaultDeny: true
  ingress: []
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: database
          podSelector:
            matchLabels:
              cnpg.io/cluster: petflow-db
      ports:
        - protocol: TCP
          port: 5432
    # AWS 지정 고정 IPv4 Pod Identity 주소. NO_PROXY로 직접 연결한다.
    - to:
        - ipBlock:
            cidr: 169.254.170.23/32
      ports:
        - protocol: TCP
          port: 80
externalEgress:
  enabled: true
  runtime: python
  allowedDomains:
    - petflow-dev-ml-artifacts.s3.ap-northeast-2.amazonaws.com
env:
  - name: AWS_REGION
    value: ap-northeast-2
  - name: AWS_DEFAULT_REGION
    value: ap-northeast-2
  - name: DB_HOST
    value: petflow-db-rw.database.svc.cluster.local
  - name: DB_PORT
    value: "5432"
  - name: DB_NAME
    value: repurchase_db
  - name: DB_USER
    valueFrom:
      secretKeyRef:
        name: db-credentials
        key: DB_USER
  - name: DB_PASSWORD
    valueFrom:
      secretKeyRef:
        name: db-credentials
        key: DB_PASSWORD
cronJobs: []
